
<div class="my-5">
  <div *ngIf="isAdmin">
    <div class="chart-container w-100 my-4" style="position: relative; height:30vh; width:80vw">
    <canvas baseChart
      [data]="barChartData"
      [options]="barChartOptions"
      [type]="barChartType"
      class="mx-auto"
      style="height:30vh;"
      >
    </canvas>
  </div>
  </div>
  <div class="col-md-8 col-10 mx-auto tableWrap">
      <div class="d-flex justify-content-between align-item-center p-4">
          <mat-form-field class="p-3">
              <mat-label>Filter</mat-label>
              <input matInput (keyup)="applyFilter($event)" placeholder="search" #input>
          </mat-form-field>
          <button *ngIf="isAdmin" mat-raised-button [routerLink]="['/dashboard/add-edit-user']">Add a User</button>
      </div>
      <div class=" p-3">
        <table mat-table [dataSource]="dataSource" matSort>
            
          <ng-container matColumnDef="FIRST_NAME">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>  Name </th>
            <td mat-cell *matCellDef="let element"> {{element.FIRST_NAME}} </td>
          </ng-container>
          
          <ng-container matColumnDef="EMAIL">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Email </th>
            <td mat-cell *matCellDef="let element"> {{element.EMAIL}} </td>
          </ng-container>
      
          <ng-container matColumnDef="ROLE">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Role </th>
            <td mat-cell *matCellDef="let element"> {{element.ROLE}} </td>
          </ng-container>
      
          <ng-container matColumnDef="id">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Employee ID </th>
            <td mat-cell *matCellDef="let element"> {{element.id}} </td>
          </ng-container>
  
          <ng-container matColumnDef="delete">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Delete </th>
            <td mat-cell *matCellDef="let element"> <button mat-button (click)="deleteEmployee(element)"><mat-icon>delete</mat-icon></button> </td>
          </ng-container>
  
          <ng-container matColumnDef="Edit">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Edit </th>
            <td mat-cell *matCellDef="let element"> <button mat-button (click)="edit(element.id)"><mat-icon>edit</mat-icon></button> </td>
          </ng-container>
      
          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
      
        <mat-paginator [pageSizeOptions]="[5, 10, 20]"
                       showFirstLastButtons
                       aria-label="Select page of periodic elements"
                       class="paginator"
                       >
        </mat-paginator>
      </div>
  </div>
</div>
