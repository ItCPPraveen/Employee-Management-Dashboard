<mat-card>
  <mat-card-title class="login-header">Login</mat-card-title>
 <mat-card-content>
     <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
         <p>
            
             <mat-form-field appearance="fill" class="full-width">
           <mat-label>Select Role</mat-label>
           <mat-select formControlName="role">
             <mat-option value="admin">Admin</mat-option>
             <mat-option value="employee">Employee</mat-option>
             <mat-option value="manager">Manager</mat-option>
           </mat-select>
           <mat-error *ngIf="role.invalid && role.touched">
             Role is required
           </mat-error>
         </mat-form-field>
         </p>
        
        <p>
            <mat-form-field class="full-width">
                
              <input matInput type="email" formControlName="email" placeholder="Enter your email" />
              <mat-error *ngIf="email.invalid && email.touched">
                <span class="error-list p-0" *ngIf="email.errors?.['required']">Email is required</span>
                <span class="error-list" *ngIf="email.errors?.['email']">Invalid email</span>
              </mat-error>
            </mat-form-field>
        </p>
   
        <p>
            <mat-form-field class="full-width">
              <input matInput type='{{isVisible ? "text" : "password"}}' formControlName="password" placeholder="Enter your password" />
              <span matSuffix class="p-2 cursor-pointer"> <mat-icon (click)="isVisible = !isVisible">{{isVisible ? "visibility" : "visibility_off"}}</mat-icon></span>
              
              <mat-error *ngIf="password.invalid && password.touched">
                <span class="error-list p-0" *ngIf="password.errors?.['required']">Password is required</span>
                <span class="error-list p-0" *ngIf="password.errors?.['passwordStrength']">
                  Password must:
                  <ul class="error-list">
                    <li *ngIf="!password.errors?.['passwordStrength'].hasMinLength">Be at least 8 characters</li>
                    <li *ngIf="!password.errors?.['passwordStrength'].hasUpperCase">Have an uppercase letter</li>
                    <li *ngIf="!password.errors?.['passwordStrength'].hasNumber">Have a number</li>
                    <li *ngIf="!password.errors?.['passwordStrength'].hasSpecialChar">Have a special character</li>
                  </ul>
                </span>
              </mat-error>
            </mat-form-field>
        </p>
   
        


       <div class="button">
            <button type="submit" mat-button>Login</button>
          </div>
     </form>
 </mat-card-content>
</mat-card>
